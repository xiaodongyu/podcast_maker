# 睡前五分钟身体放松引导 — 音频合成配置
# 基于 scripts/五分钟哄睡_引导脚本.md
# 运行: python podcast_maker.py scripts/五分钟哄睡引导.yaml

title: "睡前五分钟身体放松引导"
author: "我的播客"
output: "五分钟哄睡引导"

default_voice: "zh-CN-XiaoxiaoNeural"
default_rate: "-35%"
default_pitch: "-4Hz"
default_volume: "-8%"

background:
  file: "assets/ambient/hypnosis_pad.mp3"
  gain_db: -28          # level under speech
  duck_boost_db: 12     # how much louder it swells during pauses
  fade_in_ms: 4000
  fade_out_ms: 8000

segments:
  # 开场：安顿下来
  - text: "现在，请你关掉多余的灯光，躺在床上，让身体自然地平躺下来。"
  - text: "手臂放在身体两侧，或者放在脑后，怎么舒服怎么来。"
  - text: "接下来的五分钟，你不需要用力做任何事情，只需要跟着我的声音，慢慢地放松下来。"
  - pause: 3000
  - text: "如果中途睡着了，那就是最好的结果，不用勉强自己听完。"
  - pause: 3000

  # 第一步：慢频左右眼动
  - text: "现在，轻轻闭上眼睛。"
  - text: "慢慢地，把视线转向右边。"
  - pause: 2000
  - text: "停留在这里，感受一下。"
  - pause: 2000
  - text: "然后，慢慢地转回中间。"
  - pause: 2000
  - text: "再慢慢转向左边。"
  - pause: 2000
  - text: "停留片刻。"
  - pause: 2000
  - text: "再慢慢转回中间。"
  - pause: 3000
  - text: "很好，我们再重复一次，不用着急。"
  - pause: 1000
  - text: "慢慢转向右边……停留……转回中间……"
  - pause: 4000
  - text: "慢慢转向左边……停留……转回中间。"
  - pause: 4000
  - text: "如果你感觉到一丝困意，或者不由自主地打了个哈欠，那很好，说明身体已经开始放松了。"
  - pause: 3000

  # 第二步：轻揉耳朵
  - text: "接下来，把注意力放到耳朵上。"
  - text: "用拇指和食指，轻轻捏住耳垂，慢慢地揉一揉。"
  - pause: 4000
  - text: "顺着耳廓的边缘，从下往上，轻轻地按摩。"
  - pause: 4000
  - text: "如果你愿意，也可以用手指轻轻按住耳朵中间凹陷的地方，做一点轻柔的按压。"
  - pause: 4000
  - text: "不用很用力，轻轻地，慢慢地。"
  - pause: 5000
  - text: "让耳朵，还有整个头部，都放松下来。"
  - pause: 4000

  # 第三步：延长呼气的深呼吸
  - text: "现在，把手轻轻放下，把注意力放在呼吸上。"
  - text: "用鼻子慢慢吸气……二……三……四。"
  - pause: 1000
  - text: "屏住呼吸……二……三……四……五……六……七。"
  - pause: 1000
  - text: "缓慢地把气呼出去……二……三……四……五……六……七……八。"
  - pause: 2000
  - text: "很好，我们再来一次。"
  - text: "吸气……二……三……四。"
  - pause: 1000
  - text: "屏住……二……三……四……五……六……七。"
  - pause: 1000
  - text: "呼气，慢慢地……二……三……四……五……六……七……八。"
  - pause: 2000
  - text: "再来一次，不用刻意追求准确的秒数，只要呼气比吸气长很多就好。"
  - text: "吸气……"
  - pause: 4000
  - text: "屏住……"
  - pause: 7000
  - text: "慢慢呼出去……"
  - pause: 8000
  - text: "最后一次，让呼吸自然地慢下来。"
  - text: "吸气……"
  - pause: 4000
  - text: "屏住……"
  - pause: 7000
  - text: "缓缓地呼出去……"
  - pause: 9000

  # 第四步：顺时针揉腹
  - text: "现在，把一只手轻轻放在肚子上。"
  - text: "顺时针的方向，慢慢地、轻柔地画圈按摩。"
  - pause: 5000
  - text: "不用思考什么，也不用刻意用力，只是让手随着呼吸，轻轻地转动。"
  - pause: 6000
  - text: "继续这样揉着，慢慢地，慢慢地。"
  - pause: 8000
  - text: "揉着揉着，你可能会开始觉得，身体越来越沉，越来越暖。"
  - pause: 8000
  - text: "那就是困意正在靠近。"
  - pause: 6000

  # 结尾：交给睡意
  - text: "很好，你已经完成了这一整套放松练习。"
  - text: "现在，不需要再做任何事情。"
  - pause: 3000
  - text: "让自己继续保持这种放松的状态，慢慢地，让睡意带着你，往下沉，往下沉。"
  - pause: 6000
  - text: "晚安。"
  - pause: 15000
